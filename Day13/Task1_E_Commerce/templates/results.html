{% extends "base.html" %}
{% block content %}

<h2 class="mb-3">Results Page (All Items)</h2>

<table class="table table-bordered table-striped shadow-sm bg-white">
  <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Category</th>
      <th>Price</th>
      <th>Stock</th>
    </tr>
  </thead>
  <tbody>
    {% for item in items %}
    <tr>
      <td>{{item.id}}</td>
      <td>{{item.name}}</td>
      <td>{{item.category}}</td>
      <td>₹{{item.price}}</td>
      <td>{{item.stock}}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
